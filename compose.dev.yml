# Local development dependencies: `docker compose -f compose.dev.yml up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sucard
      POSTGRES_PASSWORD: sucard
      POSTGRES_DB: sucard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sucard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
