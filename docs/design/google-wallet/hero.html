<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .hero{width:1032px;height:336px;position:relative;overflow:hidden;
    background:linear-gradient(115deg,#0F3056 0%,#0F3056 55%,#0F548D 100%);font-family:Poppins,sans-serif}
  .arch{position:absolute;right:70px;top:70px;width:260px;height:360px;border-radius:130px 130px 0 0;
    border:56px solid #018BCE;border-bottom:none;box-sizing:border-box}
  .arch2{position:absolute;right:-40px;top:150px;width:200px;height:300px;border-radius:100px 100px 0 0;
    border:44px solid rgba(255,255,255,.08);border-bottom:none;box-sizing:border-box}
  .bar{position:absolute;right:400px;top:-30px;width:56px;height:170px;border-radius:0 0 28px 28px;background:#0F548D}
  .dot{position:absolute;right:345px;top:60px;width:54px;height:54px;border-radius:50%;background:#018BCE}
  .txt{position:absolute;left:64px;top:62px;color:#fff}
  .title{font-family:Anton,sans-serif;font-size:118px;line-height:1;letter-spacing:2px}
  .title span{color:#018BCE}
  .tag{margin-top:18px;font-size:22px;font-weight:500;color:#cfe6f5;letter-spacing:.3px}
</style></head>
<body>
<div class="hero">
  <div class="arch2"></div>
  <div class="bar"></div>
  <div class="dot"></div>
  <div class="arch"></div>
  <div class="txt">
    <div class="title">SU <span>CARD</span></div>
    <div class="tag">Student perks at Nile University partners</div>
  </div>
</div>
</body></html>
